[package]
name = "k8sbackup-rs"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Backs up Kubernetes API objects as restore-friendly YAML files, optionally storing them in a restic-compatible repository."
repository = "https://github.com/AlexanderThaller/k8sbackup-rs"
keywords = ["kubernetes", "backup", "restic", "k8s"]
categories = ["command-line-utilities"]

[dependencies]
age = "0.12"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4", features = ["client", "derive", "rustls-tls"] }
rustic_backend = "0.7"
rustic_core = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7"] }

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"

[profile.deploy]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
